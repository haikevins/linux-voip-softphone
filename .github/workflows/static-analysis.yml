name: Static Analysis

on:
  push:
  pull_request:

jobs:
  clang-tidy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Verify documentation structure
        run: ./scripts/quality/verify-docs-structure.sh

      - name: Verify evidence structure
        run: ./scripts/quality/verify-evidence-structure.sh

      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build clang-format clang-tidy libgtest-dev

      - name: Check formatting
        run: |
          find src tests labs -type f \( -name '*.cpp' -o -name '*.hpp' \) -print0 \
            | xargs -0 clang-format --dry-run --Werror

      - name: Configure
        run: cmake --preset clang-tidy

      - name: Run clang-tidy during build
        run: cmake --build --preset clang-tidy -j 2

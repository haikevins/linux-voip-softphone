name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build libgtest-dev

      - name: Configure
        run: cmake --preset debug

      - name: Build
        run: cmake --build --preset debug -j 2

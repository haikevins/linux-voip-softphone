name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build \
            libgtest-dev \
            qt6-base-dev \
            qt6-declarative-dev \
            qml6-module-qtquick

      - name: Configure
        run: cmake --preset debug

      - name: Build
        run: cmake --build --preset debug -j 2

      - name: Configure Qt/QML GUI
        run: cmake --preset qt-debug

      - name: Build Qt/QML GUI
        run: cmake --build --preset qt-debug --target voip_gui -j 2

name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build \
            libgtest-dev \
            qt6-base-dev \
            qt6-declarative-dev \
            qml6-module-qtquick \
            qml6-module-qtqml-workerscript

      - name: Configure
        run: cmake --preset debug

      - name: Build
        run: cmake --build --preset debug -j 2

      - name: Configure Qt/QML GUI
        run: cmake --preset qt-debug

      - name: Build Qt/QML GUI and Phase 7 tests
        run: cmake --build --preset qt-debug -j 2

      - name: Run Phase 7 Qt tests
        run: ctest --test-dir build/qt-debug -L phase7 --no-tests=error --output-on-failure
